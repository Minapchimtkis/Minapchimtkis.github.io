* {

html, body {

button {

/* רקע פיננסי עתידני */

}

}

.screen {

  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
}

.screen-center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.screen-top {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 64px;
}

.container {
  max-width: 440px;

}

.container-q {

  -webkit-backdrop-filter: blur(8px);
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.05em;
  margin: 8px 0 40px;
}
.brand-badge .cyan { color: var(--cyan); }
.brand-badge .yellow { color: var(--yellow); }

/* כותרת */
.hero-title {
  font-size: clamp(32px, 9vw, 48px);
  font-weight: 900;
  line-height: 1.15;

}
.hero-title .cyan { color: var(--cyan); }
.hero-title .yellow { color: var(--yellow); }

.hero-desc {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-muted);
  font-weight: 500;

}

.hero-tagline {
  font-size: 14px;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 80px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 900;
  transition: transform 0.15s ease;
  font-family: inherit;
}

.btn:active { transform: scale(0.98); }

.btn-primary {
  background-color: var(--yellow);
  color: var(--bg);
  box-shadow: 0 8px 30px rgba(250,204,21,0.25);
}

.btn-secondary {
  background-color: rgba(2, 8, 18, 0.5);
  color: var(--cyan);
  font-weight: 700;
  border: 1.5px solid var(--cyan);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.btn-whatsapp {
  background-color: #25D366;
  color: #fff;
  box-shadow: 0 8px 30px rgba(37, 211, 102, 0.3);
}

.btn-reset {
  background-color: transparent;
  color: var(--text-muted);
  font-weight: 500;
  font-size: 14px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid var(--border);
  width: 100%;
}

.btn-stack > * + * { margin-top: 18px; }

.disclaimer {

}

.q-domain {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2em;

}

.q-counter {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.progress-track {

}

.progress-bar {
  height: 100%;

}

.q-text {

  line-height: 1.3;
  margin-bottom: 32px;

  text-align: right;
  padding: 16px;
  border-radius: 16px;
  background-color: rgba(10, 20, 40, 0.55);

  color: var(--text);

  font-size: 15px;
  line-height: 1.5;
  backdrop-filter: blur(10px);

  transition: all 0.2s ease;
  font-family: inherit;
}

.answer-btn:hover {
  border-color: var(--yellow);
  transform: translateY(-1px);
}

.answer-btn:active { transform: scale(0.98); }

.answer-stack > * + * { margin-top: 16px; }

  display: block;
  margin: 32px auto 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  background: transparent;
  border: none;
  text-decoration: underline;
  text-underline-offset: 4px;

.result-emoji {
  font-size: 72px;
  margin-bottom: 16px;

.result-label {

.result-card {

  border: 1px solid var(--border);

.tip-label {
  font-size: 12px;
  letter-spacing: 0.2em;

  color: var(--yellow);

}

.result-text {
  font-size: 16px;
  line-height: 1.6;
  font-weight: 500;
}

.closing {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--cyan);
  margin: 0 8px 32px;
}

/* פולבק טעינה */
#root:empty::before {
  content: '⚡';
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--yellow);
  font-size: 48px;
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}

/* אנימציית כניסה */
.fade-in {
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

    { text: "מתחילים ומקווים שיסתדר", score: 0 }]},
  { domain: "הסביבה הפיננסית", question: "קנית אוזניות, ואחרי שבוע הן הפסיקו לעבוד. מה הזכות שלך?", answers: [
    { text: "כבר קניתי, אין מה לעשות", score: 0 },
    { text: "מגיע לי החזר או החלפה לפי חוק הגנת הצרכן", score: 2 },
    { text: "תלוי אם החנות מסכימה", score: 1 },
    { text: "לא יודע/ת מה הזכויות שלי", score: 0 }]}
];

const SHORT_QUIZ = [FULL_QUIZ[3], FULL_QUIZ[4], FULL_QUIZ[6], FULL_QUIZ[9], FULL_QUIZ[13]];

// ============================================================
// ערבול
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// רמות
// ============================================================
function getLevel(score, max) {
  const p = (score / max) * 100;
  if (p <= 33) return {
    title: "מתחיל/ה", emoji: "🌱", color: "#38bdf8",
    description: "אתה בתחילת המסע הפיננסי שלך, וזה הזמן המושלם להניח את היסודות. הידע הבסיסי הוא 80% מההצלחה לאורך זמן.",
    tip: "התחל לרשום במשך שבועיים כל שקל שאתה מוציא. רק לרשום, בלי לשפוט. בסוף השבועיים תופתע ממה שתגלה על עצמך.",
    closing: "כל מי שהיום שולט בכסף שלו, התחיל בדיוק מהמקום שאתה נמצא בו עכשיו. ✨"
  };
  if (p <= 66) return {
    title: "בינוני/ת", emoji: "⚡", color: "#facc15",
    description: "יש לך אינטואיציה פיננסית בריאה, וזה גדול. עכשיו הזמן להפוך אותה לשיטה קבועה במקום החלטות נקודתיות.",
    tip: "אמץ את כלל 50/30/20: 50% להוצאות חובה, 30% להוצאות שאתה אוהב, 20% לחיסכון. תפעיל את זה החודש.",
    closing: "אתה במרחק החלטה אחת מלשפר את העתיד הפיננסי שלך. 🚀"
  };
  return {
    title: "מתקדם/ת", emoji: "👑", color: "#facc15",
    description: "אתה כבר חושב כמו בן אדם שמנהל את הכסף שלו ברצינות. השלב הבא הוא הפיכת ידע לפעולה לאורך זמן.",
    tip: "תתחיל לקרוא על קרנות מחקות, ריבית דריבית ופיזור השקעות. הזמן כבר עובד עבורך, נצל את זה.",
    closing: "השליטה הפיננסית שלך תפתח לך דלתות שאחרים לא יראו. 🏆"
  };
}

// ============================================================
// אפליקציה
// ============================================================
const state = {
  mode: null,
  currentQ: 0,
  answers: [],
  quiz: []
};

const root = document.getElementById('root');

function startQuiz(mode) {
  const source = mode === 'full' ? FULL_QUIZ : SHORT_QUIZ;
  state.mode = mode;
  state.currentQ = 0;
  state.answers = [];
  state.quiz = source.map(q => ({ ...q, answers: shuffle(q.answers) }));
  render();
}

function reset() {
  state.mode = null;
  state.currentQ = 0;
  state.answers = [];
  state.quiz = [];
  render();
}

function answerQ(score) {
  state.answers.push(score);
  if (state.currentQ + 1 < state.quiz.length) {
    state.currentQ++;
  } else {
    state.currentQ = state.quiz.length;
  }
  render();
}

function shareWA() {
  const total = state.answers.reduce((a, b) => a + b, 0);
  const max = state.quiz.length * 2;
  const level = getLevel(total, max);
  const text = `עשיתי עכשיו שאלון אפיון פיננסי בעמוד הפיננסי לנוער בישראל, מנפחים ת'כיס 💸\n\nיצא לי: ${level.title}\nציון: ${total} מתוך ${max}\n\nנסה גם, רק 3 דקות 👇\n${window.location.href}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  // ===== מסך פתיחה =====
  if (!state.mode) {
    root.innerHTML = `
      <div class="screen fade-in">
        <div class="screen-top">
          <div class="container">
            <div class="brand-badge">
              <span class="cyan">מנפחים</span><span class="yellow"> ת'כיס</span>
            </div>
            <h1 class="hero-title">
              <span class="cyan">כמה אתה באמת</span><br>
              <span class="yellow">מבין בכסף?</span>
            </h1>
            <p class="hero-tagline">3 דקות. בלי שיפוטיות. רק שיקוף.</p>
            <div class="btn-stack">
              <button class="btn btn-primary" onclick="startQuiz('full')">גרסה מלאה · 16 שאלות</button>
              <button class="btn btn-secondary" onclick="startQuiz('short')">מיני שאלון · 5 שאלות</button>
            </div>
          </div>
        </div>
        <div class="disclaimer">תוכן חינוכי בלבד. אינו מהווה ייעוץ פיננסי או השקעות.</div>
      </div>`;
    return;
  }

  // ===== מסך תוצאה =====
  if (state.currentQ >= state.quiz.length) {
    const total = state.answers.reduce((a, b) => a + b, 0);
    const max = state.quiz.length * 2;
    const level = getLevel(total, max);
    root.innerHTML = `
      <div class="screen fade-in" style="background-image: radial-gradient(circle at 50% 0%, ${level.color}22, transparent 60%);">
        <div class="screen-center">
          <div class="container-q">
            <div style="text-align: center; margin-bottom: 32px;">
              <div class="result-emoji">${level.emoji}</div>
              <div class="result-label">הרמה הפיננסית שלך</div>
              <h2 class="result-title" style="color: ${level.color};">${escapeHTML(level.title)}</h2>
              <div class="result-score">${total} מתוך ${max} נקודות</div>
            </div>
            <div class="result-card">
              <p class="result-text">${escapeHTML(level.description)}</p>
            </div>
            <div class="result-card result-card-tip" style="border-color: ${level.color}80;">
              <div class="tip-label" style="color: ${level.color};">⚡ טיפ פרקטי בשבילך</div>
              <p class="result-text">${escapeHTML(level.tip)}</p>
            </div>
            <p class="closing">${escapeHTML(level.closing)}</p>
            <div class="btn-stack">
              <button class="btn btn-whatsapp" onclick="shareWA()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.693.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                שתף בוואטסאפ
              </button>
              <button class="btn-reset" onclick="reset()">חזרה להתחלה</button>
            </div>
          </div>
        </div>
      </div>`;
    return;
  }

  // ===== מסך שאלה =====
  const q = state.quiz[state.currentQ];
  const progress = ((state.currentQ + 1) / state.quiz.length) * 100;
  root.innerHTML = `
    <div class="screen fade-in" key="${state.currentQ}">
      <div class="screen-center">
        <div class="container-q">
          <div class="q-header">
            <span class="q-domain">${escapeHTML(q.domain)}</span>
            <span class="q-counter">${state.currentQ + 1} / ${state.quiz.length}</span>
          </div>
          <div class="progress-track">
            <div class="progress-bar" style="width: ${progress}%;"></div>
          </div>
          <h2 class="q-text">${escapeHTML(q.question)}</h2>
          <div class="answer-stack">
            ${q.answers.map((a, i) => `<button class="answer-btn" onclick="answerQ(${a.score})">${escapeHTML(a.text)}</button>`).join('')}
          </div>
          <button class="reset-link" onclick="reset()">התחל מחדש</button>
        </div>
      </div>
    </div>`;
}

// ============================================================
// הגנות
// ============================================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.keyCode === 123) e.preventDefault();
  if (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) e.preventDefault();
  if (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) e.preventDefault();
});

console.log('%c⚠️ עצור!', 'color: #facc15; font-size: 32px; font-weight: 900;');
console.log('%cזה אזור למפתחים. אם מישהו אמר לך להעתיק כאן משהו, זה ניסיון הונאה.', 'color: #38bdf8; font-size: 14px;');
console.log("%cמנפחים ת'כיס · החינוך הפיננסי שלך מתחיל כאן.", 'color: #38bdf8; font-size: 14px;');

// התחל
render();
</script>
</body>
</html>
